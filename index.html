<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%BRAND_THEME%" />
    <meta name="description" content="%BRAND_DESC%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_SHORT%" />
    <title>%BRAND_NAME%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet" />
    <style>html{background:#0f131a}body{margin:0}.splash{position:fixed;inset:0;display:grid;place-items:center;background:#0f131a;z-index:100}.splash-in{display:grid;justify-items:center;gap:16px}.splash-mark{width:76px;height:76px;animation:spIn .9s cubic-bezier(.19,1,.22,1) both}.splash-name{color:#f2f1ec;font:700 15px "Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;letter-spacing:.14em}.splash-bar{width:120px;height:2px;background:rgba(201,164,92,.18);overflow:hidden;border-radius:2px}.splash-bar i{display:block;height:100%;width:40%;background:#c9a45c;animation:spBar 1.2s ease-in-out infinite}@keyframes spIn{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}@media (prefers-reduced-motion:reduce){.splash-mark,.splash-bar i{animation:none}}</style>
  </head>
  <body>
    <div id="root"><div class="splash" role="status" aria-label="読み込み中"><div class="splash-in"><svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true"><line x1="32" y1="14" x2="32" y2="7" stroke="#cdd3db" stroke-width="2.6" stroke-linecap="round"/><circle cx="32" cy="6" r="3.6" fill="#C9A45C"/><rect x="6" y="26" width="6" height="14" rx="3" fill="#C9A45C"/><rect x="52" y="26" width="6" height="14" rx="3" fill="#C9A45C"/><rect x="10" y="14" width="44" height="38" rx="15" fill="#F5F7FA" stroke="#d6dbe2"/><rect x="16" y="22" width="32" height="20" rx="9" fill="#141922"/><circle cx="25" cy="32" r="3.2" fill="#7FE3FF"/><circle cx="39" cy="32" r="3.2" fill="#7FE3FF"/></svg><div class="splash-name">%BRAND_NAME%</div><div class="splash-bar"><i></i></div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
